services:
  postgres:
    image: postgres:16-alpine
    container_name: sonora-postgres
    environment:
      POSTGRES_DB: sonora
      POSTGRES_USER: sonora
      POSTGRES_PASSWORD: sonora
    ports:
      - "5432:5432"
    volumes:
      - sonora-pg:/var/lib/postgresql/data
volumes:
  sonora-pg:

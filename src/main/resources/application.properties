spring.application.name=sonora
server.port=${PORT:8080}

# --- PostgreSQL (default) ---
spring.datasource.url=${SONORA_DB_URL:jdbc:postgresql://localhost:5432/sonora}
spring.datasource.username=${SONORA_DB_USER:sonora}
spring.datasource.password=${SONORA_DB_PASSWORD:sonora}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Media storage (seeded demo media is copied here on first start) ---
sonora.storage.path=${SONORA_STORAGE:./sonora-data}
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=70MB

# --- Demo accounts (change these before deploying anywhere public) ---
sonora.seed.enabled=true
sonora.seed.admin-password=${SONORA_ADMIN_PASSWORD:sonora-admin}
sonora.seed.demo-password=${SONORA_DEMO_PASSWORD:sonora-demo}

# --- AI lyrics (OpenAI speech-to-text) ---
# Put your key in the OPENAI_API_KEY environment variable, or in config/application.properties next to pom.xml.
sonora.openai.api-key=${OPENAI_API_KEY:}
sonora.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
sonora.openai.model=${OPENAI_TRANSCRIBE_MODEL:whisper-1}

# --- Static app ---
spring.web.resources.cache.cachecontrol.no-cache=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=14d
